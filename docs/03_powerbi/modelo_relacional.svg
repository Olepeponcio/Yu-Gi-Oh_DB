<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <defs>
    <style>
      .bg { fill: #fbfcff; }
      .title { font: 800 44px Arial, sans-serif; fill: #071022; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #5c6678; }
      .section { font: 700 20px Arial, sans-serif; fill: #344054; }
      .box { stroke-width: 2.3; rx: 9; }
      .dim { fill: #edf6ff; stroke: #2468a8; }
      .dim-alt { fill: #f5efff; stroke: #7b4bb8; }
      .dim-time { fill: #f1faea; stroke: #4d8f35; }
      .fact { fill: #edf8f0; stroke: #257a3e; }
      .fact-bridge { fill: #fff6e5; stroke: #aa6a00; }
      .fact-history { fill: #eef5ff; stroke: #1e64ad; }
      .header { font: 700 21px Arial, sans-serif; fill: #0f1a2d; }
      .field { font: 400 15px Arial, sans-serif; fill: #253044; }
      .key { font: 700 15px Arial, sans-serif; fill: #0f1a2d; }
      .note { font: 400 15px Arial, sans-serif; fill: #465468; }
      .line { stroke: #1f2937; stroke-width: 2.2; fill: none; }
      .line-muted { stroke: #667085; stroke-width: 2; fill: none; }
      .label { font: 700 23px Arial, sans-serif; fill: #050b18; }
      .divider { stroke: #9fb0c5; stroke-width: 1; }
      .legend { fill: #ffffff; stroke: #c8ceda; stroke-width: 1.5; rx: 10; }
      .legend-title { font: 700 18px Arial, sans-serif; fill: #0f1a2d; }
      .legend-text { font: 400 16px Arial, sans-serif; fill: #354156; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1f2937" stroke-width="1.9"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#667085" stroke-width="1.9"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1280"/>
  <text class="title" x="900" y="68" text-anchor="middle">Modelo relacional de views para Power BI</text>
  <text class="subtitle" x="900" y="108" text-anchor="middle">Dimensiones 1 -> * hechos; los hechos no se relacionan entre si</text>

  <text class="section" x="150" y="172">Dimensiones de catalogo</text>
  <text class="section" x="760" y="172">Hechos de analisis</text>
  <text class="section" x="1370" y="172">Dimensiones de segmentacion</text>

  <!-- Relationships: draw before boxes -->
  <path class="line" marker-end="url(#arrow)" d="M 470 270 L 710 270"/>
  <text class="label" x="488" y="258">1</text>
  <text class="label" x="680" y="302">*</text>
  <path class="line" marker-end="url(#arrow)" d="M 470 330 L 710 470"/>
  <text class="label" x="488" y="352">1</text>
  <text class="label" x="680" y="502">*</text>
  <path class="line" marker-end="url(#arrow)" d="M 470 390 L 710 690"/>
  <text class="label" x="488" y="418">1</text>
  <text class="label" x="680" y="722">*</text>
  <path class="line" marker-end="url(#arrow)" d="M 470 450 L 710 910"/>
  <text class="label" x="488" y="480">1</text>
  <text class="label" x="680" y="942">*</text>

  <path class="line-muted" marker-end="url(#arrow-muted)" d="M 470 660 L 710 720"/>
  <text class="label" x="488" y="652">1</text>
  <text class="label" x="680" y="752">*</text>
  <path class="line-muted" marker-end="url(#arrow-muted)" d="M 470 890 L 710 760"/>
  <text class="label" x="488" y="880">1</text>
  <text class="label" x="680" y="792">*</text>

  <path class="line" marker-end="url(#arrow)" d="M 1365 265 L 1120 470"/>
  <text class="label" x="1332" y="262">1</text>
  <text class="label" x="1130" y="502">*</text>
  <path class="line" marker-end="url(#arrow)" d="M 1365 330 L 1120 910"/>
  <text class="label" x="1332" y="350">1</text>
  <text class="label" x="1130" y="942">*</text>

  <path class="line" marker-end="url(#arrow)" d="M 1365 515 L 1120 510"/>
  <text class="label" x="1332" y="507">1</text>
  <text class="label" x="1130" y="542">*</text>
  <path class="line" marker-end="url(#arrow)" d="M 1365 575 L 1120 955"/>
  <text class="label" x="1332" y="598">1</text>
  <text class="label" x="1130" y="987">*</text>

  <path class="line" marker-end="url(#arrow)" d="M 1365 815 L 1120 955"/>
  <text class="label" x="1332" y="812">1</text>
  <text class="label" x="1130" y="987">*</text>

  <!-- Left dimensions -->
  <rect class="box dim" x="95" y="205" width="375" height="280"/>
  <text class="header" x="135" y="245">vw_dim_cards_descriptive</text>
  <line class="divider" x1="95" y1="263" x2="470" y2="263"/>
  <text class="key" x="135" y="298">card_id</text>
  <text class="field" x="135" y="328">name, card_type, human_readable_card_type</text>
  <text class="field" x="135" y="358">frame_type, race, archetype, attribute</text>
  <text class="field" x="135" y="388">atk, def, level, scale, link_value</text>
  <text class="note" x="135" y="433">Filtro comun para todos los hechos.</text>

  <rect class="box dim" x="125" y="580" width="345" height="155"/>
  <text class="header" x="174" y="620">vw_dim_sets_descriptive</text>
  <line class="divider" x1="125" y1="638" x2="470" y2="638"/>
  <text class="key" x="165" y="673">set_id</text>
  <text class="field" x="165" y="703">set_name, created_at, updated_at</text>

  <rect class="box dim-alt" x="125" y="815" width="345" height="205"/>
  <text class="header" x="160" y="855">vw_dim_rarities_descriptive</text>
  <line class="divider" x1="125" y1="873" x2="470" y2="873"/>
  <text class="key" x="165" y="908">rarity_id</text>
  <text class="field" x="165" y="938">set_code, rarity_name, rarity_code</text>
  <text class="field" x="165" y="968">rarity_business_key</text>
  <text class="field" x="165" y="998">created_at, updated_at</text>

  <!-- Center facts -->
  <rect class="box fact" x="710" y="205" width="410" height="165"/>
  <text class="header" x="743" y="245">vw_fact_avg_market_price</text>
  <line class="divider" x1="710" y1="263" x2="1120" y2="263"/>
  <text class="key" x="750" y="298">card_id</text>
  <text class="field" x="750" y="328">card_name</text>
  <text class="field" x="750" y="358">cardmarket, tcgplayer, ebay, amazon, coolstuffinc, avg_price_USD</text>

  <rect class="box fact" x="710" y="425" width="410" height="180"/>
  <text class="header" x="735" y="465">vw_fact_card_prices_descriptive</text>
  <line class="divider" x1="710" y1="483" x2="1120" y2="483"/>
  <text class="key" x="750" y="518">card_id, marketplace, currency</text>
  <text class="field" x="750" y="548">card_name, price</text>
  <text class="note" x="750" y="578">Grano: carta + marketplace + moneda.</text>

  <rect class="box fact-bridge" x="710" y="645" width="410" height="220"/>
  <text class="header" x="735" y="685">vw_fact_card_set_appearances</text>
  <line class="divider" x1="710" y1="703" x2="1120" y2="703"/>
  <text class="key" x="750" y="738">card_set_appearance_id</text>
  <text class="key" x="750" y="768">card_id, set_id, rarity_id</text>
  <text class="field" x="750" y="798">card_name, set_name, rarity_name</text>
  <text class="field" x="750" y="828">rarity_code, set_code, set_price, appearance_count</text>

  <rect class="box fact-history" x="710" y="905" width="410" height="245"/>
  <text class="header" x="724" y="945">vw_fact_card_price_variation_predictive</text>
  <line class="divider" x1="710" y1="963" x2="1120" y2="963"/>
  <text class="key" x="750" y="998">card_id, marketplace, currency, snapshot_at</text>
  <text class="field" x="750" y="1028">card_name, previous_snapshot_at</text>
  <text class="field" x="750" y="1058">days_between_snapshots</text>
  <text class="field" x="750" y="1088">price, previous_price, price_change, price_change_pct</text>
  <text class="note" x="750" y="1123">Grano: carta + marketplace + moneda + snapshot.</text>

  <!-- Right dimensions -->
  <rect class="box dim-alt" x="1365" y="205" width="355" height="165"/>
  <text class="header" x="1400" y="245">vw_dim_marketplaces_descriptive</text>
  <line class="divider" x1="1365" y1="263" x2="1720" y2="263"/>
  <text class="key" x="1405" y="298">marketplace</text>
  <text class="field" x="1405" y="328">marketplace_id, marketplace_name</text>
  <text class="field" x="1405" y="358">default_currency, market_region</text>

  <rect class="box dim-alt" x="1365" y="455" width="355" height="145"/>
  <text class="header" x="1420" y="495">vw_dim_currencies_descriptive</text>
  <line class="divider" x1="1365" y1="513" x2="1720" y2="513"/>
  <text class="key" x="1405" y="548">currency</text>
  <text class="field" x="1405" y="578">currency_name, currency_symbol_text</text>

  <rect class="box dim-time" x="1365" y="755" width="355" height="210"/>
  <text class="header" x="1422" y="795">vw_dim_snapshots_descriptive</text>
  <line class="divider" x1="1365" y1="813" x2="1720" y2="813"/>
  <text class="key" x="1405" y="848">snapshot_at</text>
  <text class="field" x="1405" y="878">snapshot_date, snapshot_year</text>
  <text class="field" x="1405" y="908">snapshot_quarter, snapshot_month</text>
  <text class="field" x="1405" y="938">snapshot_month_name, snapshot_day, snapshot_hour</text>

  <!-- Legend -->
  <rect class="legend" x="150" y="1190" width="470" height="58"/>
  <text class="legend-title" x="180" y="1215">Dimensiones</text>
  <text class="legend-text" x="180" y="1238">Filtran y agrupan. Lado 1 de la relacion.</text>

  <rect class="legend" x="690" y="1190" width="460" height="58"/>
  <text class="legend-title" x="720" y="1215">Hechos</text>
  <text class="legend-text" x="720" y="1238">Contienen medidas y granos analiticos.</text>

  <rect class="legend" x="1220" y="1190" width="430" height="58"/>
  <text class="legend-title" x="1250" y="1215">Direccion</text>
  <text class="legend-text" x="1250" y="1238">Filtro unico: dimension 1 -> hecho *.</text>
</svg>
